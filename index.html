<header><div style="max-width:740px;margin:auto"><div class="sub">TRAIN · TRACK · PROGRESS · THRIVE  /  v0.7.3</div><h1><span class="brand-mark">△</span> Body Lab <span class="brand-spark">✳</span></h1><div class="bl-header-row"><div class="sub">Controlled strength · Mobility · Sustainable progress</div><a class="bl-music-link" href="https://music.apple.com/" target="_blank" rel="noopener noreferrer" aria-label="Open Apple Music in a new tab or app">♫ Apple Music ↗</a></div></div></header>

'use strict';const KEY='bodylab_v01';const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const plan={Mon:{name:'Upper-body strength',type:'strength',ex:[['Dumbbell floor press','2 × 8–12','Controlled 3-second lowering; neutral spine'],['Chest-supported dumbbell row','2 × 8–12','Keep chest supported'],['Light chest fly','1–2 × 8–12','Comfortable shoulder range; avoid excessive stretch'],['Band pull-apart','2 × 10–15','Smooth, controlled'],['Bird dog','2 × 5/side','Stable trunk; no painful extension']]},Tue:{name:'Apple Fitness+ yoga + walk',type:'mobility',ex:[['Yoga','15–20 min','Choose poses that do not provoke back or leg symptoms'],['Walking','10–15 min','Conversational pace']]},Wed:{name:'Back-conscious lower body',type:'strength',ex:[['Supported sit-to-stand','2 × 8–10','Comfortable depth; no provoking load'],['Low supported step-up','2 × 6–10/side','Stable step; no radiating symptoms'],['Supported calf raise','2 × 10–15','Controlled'],['Standing band hip abduction','2 × 10–15','Keep pelvis steady'],['Modified side plank','2 × 15–25 sec','Stop if symptoms occur']]},Thu:{name:'Cardio + mobility',type:'cardio',ex:[['Brisk walking or cycling','20–25 min','Moderate intensity, conversational'],['Gentle mobility','5–10 min','Hip and ankle range without forcing spine']]},Fri:{name:'Full-body strength',type:'strength',ex:[['Incline push-up','2 × 8–12','Slow lowering'],['Supported one-arm row','2 × 8–12','Support torso on bench'],['Supported shallow split squat','2 × 6–10/side','Short comfortable range'],['Dumbbell curl','2 × 8–12','Controlled'],['Dead bug','2 × 5–8/side','Avoid lumbar arching']]},Sat:{name:'Yoga / pickleball / recovery',type:'mobility',ex:[['Yoga, pickleball or easy walk','20–30 min','Choose based on recovery; optional day']]},Sun:{name:'Rest',type:'rest',ex:[]}};
const initial={profile:{age:47,height:'5 ft 7 in',weight:162,experience:'Intermediate',goals:'Strength, longevity, muscle, fat reduction, mobility',notes:'Loading-sensitive lower back; intermittent sciatic symptoms; historical ankle fracture; enjoys yoga and controlled tempo.'},logs:[]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){db=structuredClone(initial)}if(!db.profile||!Array.isArray(db.logs))db=structuredClone(initial);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Could not save locally. Export a backup and check browser storage permissions.')}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=id=>document.getElementById(id);let active='dashboard';function tab(t){active=t;document.querySelectorAll('main>section').forEach(s=>s.classList.toggle('hidden',s.id!==t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();window.scrollTo(0,0)}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));const isoLocal=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const today=isoLocal(new Date());const dayOf=date=>days[new Date(date+'T12:00:00').getDay()];
function render(){if(active==='dashboard')dashboard();if(active==='workout')workout();if(active==='history')history();if(active==='profile')profile()}
function dashboard(){let d=dayOf(today),p=plan[d],recent=db.logs.filter(x=>x.date>=isoLocal(new Date(Date.now()-6*86400000))).length;let total=db.logs.length; $('dashboard').innerHTML=`<div class="grid"><div class="metric"><small>Sessions · last 7 days</small><b>${recent}</b></div><div class="metric"><small>Total logged sessions</small><b>${total}</b></div></div><div class="card" style="margin-top:14px"><span class="pill">${esc(d)} · ${esc(today)}</span><h2 style="margin-top:12px">${esc(p.name)}</h2><p class="muted">${p.type==='strength'?'Start at RPE 7–8, with 2–3 repetitions in reserve. Prioritize symptom-free controlled movement.':p.type==='rest'?'Rest is part of training.':'Yoga and sports count. Record your session and how you feel afterward.'}</p><button id="start">${p.type==='rest'?'Log optional activity':'Log today’s session'}</button></div><div class="card"><h3>This week</h3>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="day"><span class="dayname">${x}</span><div class="grow"><b>${esc(plan[x].name)}</b><div class="sub">${plan[x].type==='strength'?'Controlled resistance':plan[x].type==='rest'?'Recovery':'Mobility / conditioning'}</div></div></div>`).join('')}</div><div class="notice"><b>Safety rule:</b> Never use radiating pain, tingling, numbness, or weakness as a training target. Stop provoking movements. New or progressive weakness, saddle numbness, or bladder/bowel changes require urgent evaluation.</div>`;$('start').onclick=()=>tab('workout')}
function workout(){let d=dayOf(today),p=plan[d];$('workout').innerHTML=`<div class="card"><h2>Log a session</h2><div class="grid"><div><label>Date</label><input id="date" type="date" value="${today}"></div><div><label>Session</label><select id="session">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun','Custom'].map(x=>`<option value="${x}" ${x===d?'selected':''}>${x==='Custom'?'Custom session':plan[x].name}</option>`).join('')}</select></div></div><div id="exercises"></div><button class="secondary" id="addEx">+ Add exercise</button><div style="margin-top:18px"><div class="grid"><div><label>Duration (min)</label><input type="number" min="0" max="600" id="duration" value="30"></div><div><label>Overall effort · RPE 1–10</label><input type="number" min="1" max="10" id="rpe" value="7"></div><div><label>Back pain before · 0–10</label><input type="number" min="0" max="10" id="before" value="0"></div><div><label>Back pain after · 0–10</label><input type="number" min="0" max="10" id="after" value="0"></div></div><label>Neurological symptoms</label><select id="neuro"><option value="none">None</option><option value="unchanged">Usual intermittent symptoms, unchanged</option><option value="new">New or worsened radiating pain, tingling or numbness</option><option value="weakness">New weakness or other concerning symptoms</option></select><label>Session notes / yoga class / next-day response</label><textarea id="notes" placeholder="How did the session feel? Any symptoms or improvements?"></textarea><div class="checks"><input type="checkbox" id="safe"><label for="safe" style="margin:0">I reviewed symptoms and chose appropriate modifications</label></div><button id="saveLog">Save workout</button><p id="saveMsg" class="muted"></p></div></div>`;let current=[];const add=(name='',dose='',cue='')=>{current.push({name,dose,cue,sets:'',load:'',tempo:'',hold:''});draw()};function draw(){const el=$('exercises');el.innerHTML=current.map((x,i)=>`<div class="exercise"><b>${i+1}. ${esc(x.name||'New exercise')}</b><div class="sub">${esc(x.dose)} ${x.cue?'· '+esc(x.cue):''}</div><div class="grid"><div><label>Exercise name</label><input data-i="${i}" data-k="name" value="${esc(x.name)}"></div><div><label>Sets × reps / duration</label><input data-i="${i}" data-k="sets" value="${esc(x.sets)}" placeholder="2 × 10 or 20 min"></div><div><label>Load (lb, optional)</label><input data-i="${i}" data-k="load" value="${esc(x.load)}" placeholder="e.g. 15 each"></div><div><label>Tempo (sec, optional)</label><input data-i="${i}" data-k="tempo" value="${esc(x.tempo)}" placeholder="3-1-2-0"></div><div><label>Isometric hold (sec)</label><input data-i="${i}" data-k="hold" value="${esc(x.hold)}" placeholder="e.g. 20"></div></div><button class="secondary" data-remove="${i}">Remove</button></div>`).join('');el.querySelectorAll('input[data-i]').forEach(inp=>inp.oninput=()=>{current[+inp.dataset.i][inp.dataset.k]=inp.value});el.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{current.splice(+b.dataset.remove,1);draw()})}function reset(){current=[];let key=$('session').value;for(let x of (plan[key]?.ex||[]))current.push({name:x[0],dose:x[1],cue:x[2],sets:'',load:'',tempo:'',hold:''});draw()}$('session').onchange=reset;$('addEx').onclick=()=>add();reset();$('saveLog').onclick=()=>{if(!$('safe').checked){$('saveMsg').textContent='Please review the symptom check before saving.';return}const num=id=>Number($(id).value);let rpe=num('rpe'),before=num('before'),after=num('after'),duration=num('duration'),neuro=$('neuro').value;if(!Number.isFinite(rpe)||rpe<1||rpe>10||!Number.isFinite(before)||before<0||before>10||!Number.isFinite(after)||after<0||after>10||duration<0||duration>600){alert('Please check your numeric entries.');return}const record={id:crypto.randomUUID?.()||String(Date.now()),date:$('date').value,session:$('session').value,sessionName:plan[$('session').value]?.name||'Custom',duration,rpe,before,after,neuro,notes:$('notes').value,exercises:current.map(x=>({...x}))};if(!record.date){alert('Enter a date.');return}db.logs.push(record);save();let warn=neuro==='new'||neuro==='weakness'||after>before+2;alert('Workout saved locally.'+(warn?' Symptoms warrant reassessment before your next hard session. Seek medical evaluation for new or worsening neurological symptoms.':''));tab('history')}}

function show(){chooseValid();persist();const rec=defaults[state.day]||[];const ex=byName[state.exercise]||library[0];$('workout').innerHTML=`
<div class="card"><div class="v7-hero"><div><div class="v7-section-title">Body Lab · v0.7.3</div><h2 style="margin:0">Strength · Core · Mobility</h2></div><button class="secondary" id="v7back">← Activities</button></div><div class="grid" style="margin-top:13px"><div><label>Date</label><input id="v7date" type="date" value="${esc(state.date)}"></div><div><label>Recommended day</label><select id="v7day">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<option value="${d}" ${d===state.day?'selected':''}>${d} · ${esc(plan[d].name)}</option>`).join('')}</select></div></div><div class="v7-hint">Today's suggestions are first. Choose Core or Stretch anytime.</div></div>

<div class="v7-modal" id="v7modal" hidden role="dialog" aria-modal="true" aria-label="Exercise movement preview"><div class="v7-dialog"><div class="v7-row"><h3 id="v7modalname"></h3><button class="secondary" id="v7close">✕ Close</button></div><div class="v7-frames" id="v7frames"></div></div></div>`;
$('v7neuro').value=state.neuro;
for(const id of ['v7date','v7reps','v7load','v7seconds','v7rpe','v7tempo','v7duration','v7effort','v7before','v7after','v7neuro','v7notes'])$(id).addEventListener('input',keepFields);

function drawAll(){let el=$('v7all');if(!el)return;let counts={};for(let s of state.sets)counts[s.name]=(counts[s.name]||0)+1;el.innerHTML=Object.entries(counts).map(([n,c])=>`<div class="v7-logged"><span>${esc(n)}</span><b>${c} sets</b></div>`).join('')||'<p class="v7-hint">Nothing logged yet.</p>'}
/* Compact offline vector demonstrations. The two positions use deliberate, motion-specific limb changes. */
function illustration(type,finish){
const f=finish, line=(x1,y1,x2,y2,c='#8ef8ee',w=6)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`,circle=(x,y,r=10)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#f0a5f5" stroke-width="5"/>`;
let s='',floor=line(8,145,152,145,'#5d628e',2),arrow=`<path d="M113 38 Q134 25 137 48" fill="none" stroke="#ffcf82" stroke-width="3" stroke-dasharray="4 4"/><path d="M131 42 L137 49 L143 42" fill="none" stroke="#ffcf82" stroke-width="3"/>`;
const upright=()=>circle(80,29)+line(80,40,80,96)+line(80,96,60,137)+line(80,96,100,137);
const lying=()=>circle(27,108)+line(40,110,105,110)+line(105,110,122,137)+line(122,137,145,137)+floor;
const allU=['pull','pass','press','curl','abduct','calf','pallof','rotate','hip','fly'];
if(type==='wallgastroc'||type==='wallsoleus'){
// Side view: wall at right, forward leg bent, rear heel grounded.
const bent=type==='wallsoleus';
s=line(142,10,142,145,'#9b86df',4)+floor+circle(f?83:72,37,9)+line(f?85:75,47,f?96:89,91)+line(f?82:72,56,125,63)+line(125,63,142,62,'#ffcf82',4);
s+=line(f?96:89,91,114,115)+line(114,115,129,143);
if(bent){s+=line(f?96:89,91,f?62:53,f?115:108)+line(f?62:53,f?115:108,25,143)}
else{s+=line(f?96:89,91,f?50:44,f?120:115)+line(f?50:44,f?120:115,23,143)}
s+=`<circle cx="23" cy="143" r="3" fill="#ffcf82"/>`;
}else if(type==='wallpec'){
// Top-down diagram clarifies torso rotation relative to a fixed horizontal arm.
s=`<text x="10" y="17" fill="#c7c4e6" font-size="10">TOP VIEW</text>`+line(19,48,145,48,'#9b86df',5);
s+=`<circle cx="80" cy="${f?101:91}" r="19" fill="none" stroke="#8ef8ee" stroke-width="5"/>`;

s+=`<path d="M113 82 Q${f?135:122} 105 ${f?109:124} 128" stroke="#ffcf82" fill="none" stroke-width="3" stroke-dasharray="5 4"/>`;
}else if(type==='pigeon'){
// Side view: front shin folded, back leg extended, torso upright then gently inclined.

s+=line(f?76:64,f?89:55,f?104:46,f?117:85)+line(f?76:64,f?89:55,f?60:84,f?116:83);
}else if(allU.includes(type)){
s=upright();if(type==='pass')s+=line(80,52,f?47:35,f?93:62)+line(80,52,f?113:125,f?93:62)+line(f?47:35,f?93:62,f?113:125,f?93:62,'#ffcf82',3);
else if(type==='pull'||type==='fly')s+=line(80,52,f?24:60,f?52:76)+line(80,52,f?136:100,f?52:76)+line(f?24:60,f?52:76,f?136:100,f?52:76,'#ffcf82',3);
else if(type==='press')s+=line(80,52,55,f?8:65)+line(80,52,105,f?8:65)+line(44,f?8:65,66,f?8:65,'#ffcf82')+line(94,f?8:65,116,f?8:65,'#ffcf82');
else if(type==='curl')s+=line(80,52,52,75)+line(80,52,108,75)+line(52,75,f?62:49,f?53:101)+line(108,75,f?98:111,f?53:101);
else if(type==='abduct')s=circle(80,29)+line(80,40,80,96)+line(80,52,50,75)+line(80,52,110,75)+line(80,96,60,137)+line(80,96,f?136:100,f?120:137);
else if(type==='calf')s=upright()+line(60,137,60,f?130:142,'#ffcf82')+line(100,137,100,f?130:142,'#ffcf82');

else s+=line(80,52,f?20:55,f?44:75)+line(80,52,f?140:105,f?44:75);
}else if(['leg','dead','heel','sit','crunch','ham','bridge','tilt'].includes(type)){

}else s=upright()+line(80,52,f?25:50,f?35:75)+line(80,52,f?135:110,f?35:75);
return `<svg viewBox="0 0 160 160" role="img" aria-label="${f?'Finish':'Start'} position"><rect width="160" height="160" rx="9" fill="#101733"/>${s}${arrow}</svg>`;
}
