<header><div style="max-width:740px;margin:auto"><div class="sub">TRAIN · TRACK · PROGRESS · THRIVE  /  v0.7.3</div><h1><span class="brand-mark">△</span> Body Lab <span class="brand-spark">✳</span></h1><div class="bl-header-row"><div class="sub">Controlled strength · Mobility · Sustainable progress</div><a class="bl-music-link" href="music://" aria-label="Open Apple Music app">♫ Apple Music ↗</a></div></div></header>

'use strict';const KEY='bodylab_v01';const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const plan={Mon:{name:'Upper-body strength',type:'strength',ex:[['Dumbbell floor press','2 × 8–12','Controlled 3-second lowering; neutral spine'],['Chest-supported dumbbell row','2 × 8–12','Keep chest supported'],['Light chest fly','1–2 × 8–12','Comfortable shoulder range; avoid excessive stretch'],['Band pull-apart','2 × 10–15','Smooth, controlled'],['Bird dog','2 × 5/side','Stable trunk; no painful extension']]},Tue:{name:'Apple Fitness+ yoga + walk',type:'mobility',ex:[['Yoga','15–20 min','Choose poses that do not provoke back or leg symptoms'],['Walking','10–15 min','Conversational pace']]},Wed:{name:'Back-conscious lower body',type:'strength',ex:[['Supported sit-to-stand','2 × 8–10','Comfortable depth; no provoking load'],['Low supported step-up','2 × 6–10/side','Stable step; no radiating symptoms'],['Supported calf raise','2 × 10–15','Controlled'],['Standing band hip abduction','2 × 10–15','Keep pelvis steady'],['Modified side plank','2 × 15–25 sec','Stop if symptoms occur']]},Thu:{name:'Cardio + mobility',type:'cardio',ex:[['Brisk walking or cycling','20–25 min','Moderate intensity, conversational'],['Gentle mobility','5–10 min','Hip and ankle range without forcing spine']]},Fri:{name:'Full-body strength',type:'strength',ex:[['Incline push-up','2 × 8–12','Slow lowering'],['Supported one-arm row','2 × 8–12','Support torso on bench'],['Supported shallow split squat','2 × 6–10/side','Short comfortable range'],['Dumbbell curl','2 × 8–12','Controlled'],['Dead bug','2 × 5–8/side','Avoid lumbar arching']]},Sat:{name:'Yoga / pickleball / recovery',type:'mobility',ex:[['Yoga, pickleball or easy walk','20–30 min','Choose based on recovery; optional day']]},Sun:{name:'Rest',type:'rest',ex:[]}};
const initial={profile:{age:47,height:'5 ft 7 in',weight:162,experience:'Intermediate',goals:'Strength, longevity, muscle, fat reduction, mobility',notes:'Loading-sensitive lower back; intermittent sciatic symptoms; historical ankle fracture; enjoys yoga and controlled tempo.'},logs:[]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){db=structuredClone(initial)}if(!db.profile||!Array.isArray(db.logs))db=structuredClone(initial);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Could not save locally. Export a backup and check browser storage permissions.')}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=id=>document.getElementById(id);let active='dashboard';function tab(t){active=t;document.querySelectorAll('main>section').forEach(s=>s.classList.toggle('hidden',s.id!==t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();window.scrollTo(0,0)}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));const isoLocal=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const today=isoLocal(new Date());const dayOf=date=>days[new Date(date+'T12:00:00').getDay()];
function render(){if(active==='dashboard')dashboard();if(active==='workout')workout();if(active==='history')history();if(active==='profile')profile()}
function dashboard(){let d=dayOf(today),p=plan[d],recent=db.logs.filter(x=>x.date>=isoLocal(new Date(Date.now()-6*86400000))).length;let total=db.logs.length; $('dashboard').innerHTML=`<div class="grid"><div class="metric"><small>Sessions · last 7 days</small><b>${recent}</b></div><div class="metric"><small>Total logged sessions</small><b>${total}</b></div></div><div class="card" style="margin-top:14px"><span class="pill">${esc(d)} · ${esc(today)}</span><h2 style="margin-top:12px">${esc(p.name)}</h2><p class="muted">${p.type==='strength'?'Start at RPE 7–8, with 2–3 repetitions in reserve. Prioritize symptom-free controlled movement.':p.type==='rest'?'Rest is part of training.':'Yoga and sports count. Record your session and how you feel afterward.'}</p><button id="start">${p.type==='rest'?'Log optional activity':'Log today’s session'}</button></div><div class="card"><h3>This week</h3>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="day"><span class="dayname">${x}</span><div class="grow"><b>${esc(plan[x].name)}</b><div class="sub">${plan[x].type==='strength'?'Controlled resistance':plan[x].type==='rest'?'Recovery':'Mobility / conditioning'}</div></div></div>`).join('')}</div><div class="notice"><b>Safety rule:</b> Never use radiating pain, tingling, numbness, or weakness as a training target. Stop provoking movements. New or progressive weakness, saddle numbness, or bladder/bowel changes require urgent evaluation.</div>`;$('start').onclick=()=>tab('workout')}
function workout(){let d=dayOf(today),p=plan[d];$('workout').innerHTML=`<div class="card"><h2>Log a session</h2><div class="grid"><div><label>Date</label><input id="date" type="date" value="${today}"></div><div><label>Session</label><select id="session">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun','Custom'].map(x=>`<option value="${x}" ${x===d?'selected':''}>${x==='Custom'?'Custom session':plan[x].name}</option>`).join('')}</select></div></div><div id="exercises"></div><button class="secondary" id="addEx">+ Add exercise</button><div style="margin-top:18px"><div class="grid"><div><label>Duration (min)</label><input type="number" min="0" max="600" id="duration" value="30"></div><div><label>Overall effort · RPE 1–10</label><input type="number" min="1" max="10" id="rpe" value="7"></div><div><label>Back pain before · 0–10</label><input type="number" min="0" max="10" id="before" value="0"></div><div><label>Back pain after · 0–10</label><input type="number" min="0" max="10" id="after" value="0"></div></div><label>Neurological symptoms</label><select id="neuro"><option value="none">None</option><option value="unchanged">Usual intermittent symptoms, unchanged</option><option value="new">New or worsened radiating pain, tingling or numbness</option><option value="weakness">New weakness or other concerning symptoms</option></select><label>Session notes / yoga class / next-day response</label><textarea id="notes" placeholder="How did the session feel? Any symptoms or improvements?"></textarea><div class="checks"><input type="checkbox" id="safe"><label for="safe" style="margin:0">I reviewed symptoms and chose appropriate modifications</label></div><button id="saveLog">Save workout</button><p id="saveMsg" class="muted"></p></div></div>`;let current=[];const add=(name='',dose='',cue='')=>{current.push({name,dose,cue,sets:'',load:'',tempo:'',hold:''});draw()};function draw(){const el=$('exercises');el.innerHTML=current.map((x,i)=>`<div class="exercise"><b>${i+1}. ${esc(x.name||'New exercise')}</b><div class="sub">${esc(x.dose)} ${x.cue?'· '+esc(x.cue):''}</div><div class="grid"><div><label>Exercise name</label><input data-i="${i}" data-k="name" value="${esc(x.name)}"></div><div><label>Sets × reps / duration</label><input data-i="${i}" data-k="sets" value="${esc(x.sets)}" placeholder="2 × 10 or 20 min"></div><div><label>Load (lb, optional)</label><input data-i="${i}" data-k="load" value="${esc(x.load)}" placeholder="e.g. 15 each"></div><div><label>Tempo (sec, optional)</label><input data-i="${i}" data-k="tempo" value="${esc(x.tempo)}" placeholder="3-1-2-0"></div><div><label>Isometric hold (sec)</label><input data-i="${i}" data-k="hold" value="${esc(x.hold)}" placeholder="e.g. 20"></div></div><button class="secondary" data-remove="${i}">Remove</button></div>`).join('');el.querySelectorAll('input[data-i]').forEach(inp=>inp.oninput=()=>{current[+inp.dataset.i][inp.dataset.k]=inp.value});el.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{current.splice(+b.dataset.remove,1);draw()})}function reset(){current=[];let key=$('session').value;for(let x of (plan[key]?.ex||[]))current.push({name:x[0],dose:x[1],cue:x[2],sets:'',load:'',tempo:'',hold:''});draw()}$('session').onchange=reset;$('addEx').onclick=()=>add();reset();$('saveLog').onclick=()=>{if(!$('safe').checked){$('saveMsg').textContent='Please review the symptom check before saving.';return}const num=id=>Number($(id).value);let rpe=num('rpe'),before=num('before'),after=num('after'),duration=num('duration'),neuro=$('neuro').value;if(!Number.isFinite(rpe)||rpe<1||rpe>10||!Number.isFinite(before)||before<0||before>10||!Number.isFinite(after)||after<0||after>10||duration<0||duration>600){alert('Please check your numeric entries.');return}const record={id:crypto.randomUUID?.()||String(Date.now()),date:$('date').value,session:$('session').value,sessionName:plan[$('session').value]?.name||'Custom',duration,rpe,before,after,neuro,notes:$('notes').value,exercises:current.map(x=>({...x}))};if(!record.date){alert('Enter a date.');return}db.logs.push(record);save();let warn=neuro==='new'||neuro==='weakness'||after>before+2;alert('Workout saved locally.'+(warn?' Symptoms warrant reassessment before your next hard session. Seek medical evaluation for new or worsening neurological symptoms.':''));tab('history')}}

.v7-glass .v7-clock{color:#fff!important;text-shadow:0 2px 10px #0009;font-size:clamp(36px,10vw,54px);margin:0}
.v7-glass-label{font-size:11px;letter-spacing:.1em;font-weight:750;color:white}
.v7-spectrum-track{height:20px;margin:15px 0 7px;padding:2px;border-radius:99px;background:#ffffffbb;overflow:hidden}
.v7-spectrum-track span{display:block;width:0;height:100%;border-radius:99px;background:var(--prism-fill);border:1px solid white;box-sizing:border-box;box-shadow:inset 0 1px #ffffff55;transition:width .22s linear,background .22s linear}
.v7-spectrum-note{font-size:11px;text-align:center;margin-bottom:12px;font-weight:700}
.v7-count-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.v7-count-controls label{color:#fff;font-size:12px;font-weight:700}.v7-count-controls input{margin:5px 0 0;background:#121738e8;color:#fff;border:1px solid #ffffff88}
.v7-elapsed-strip{margin-top:14px;background:#111733b8;border:1px solid #ffffff55;border-radius:12px;padding:10px;color:white;display:flex;justify-content:space-between;align-items:center;gap:8px}
.v7-elapsed-strip b{font-variant-numeric:tabular-nums}

.v8-illustration{grid-column:1/-1;background:#0d1330;border:1px solid #6766a0;border-radius:13px;overflow:hidden;padding:5px}
.v8-illustration img{width:100%;display:block;border-radius:9px}
.v8-cue{display:flex;justify-content:space-around;color:#79f6ed;font-size:11px;font-weight:750;letter-spacing:.12em;padding:6px}
.v8-cue span{color:#ffffff}

const defaults={Mon:['Dumbbell floor press','Chest-supported dumbbell row','Band pull-apart','Bird dog'],Wed:['Supported sit-to-stand','Low supported step-up','Standing band hip abduction','Modified side plank'],Fri:['Push-up','Supported one-arm row','Supported shallow split squat','Dead bug'],Tue:['Cat-cow','Sun salutation','90/90 hip switches'],Thu:['Band shoulder pass-through','Standing wall chest / shoulder rotation stretch','Wall calf stretch · straight knee','Wall calf stretch · bent knee','Pigeon pose','Supine strap hamstring stretch','Modified yoga half lift'],Sat:['Sun salutation','Pigeon pose','90/90 hip switches'],Sun:['Cat-cow','Seated hip hinge']};
const fresh=()=>({date:today,day:dayOf(today),category:'Recommended',exercise:'',reps:'10',load:'',seconds:'',rpe:'7',tempo:'',sets:[],duration:'30',effort:'7',before:'0',after:'0',neuro:'none',notes:'',timer:{elapsed:0,started:0,running:false},rest:{remaining:90,until:0,running:false},countdown:{duration:60,remaining:60,until:0,running:false}});
let state;try{state={...fresh(),...JSON.parse(localStorage.getItem(DKEY)||'{}')}}catch{state=fresh()}
if(!Array.isArray(state.sets))state.sets=[];
if(!state.countdown||!Number.isFinite(state.countdown.duration))state.countdown={duration:60,remaining:60,until:0,running:false};
const persist=()=>{try{localStorage.setItem(DKEY,JSON.stringify(state))}catch{}};
const elapsed=()=>state.timer.elapsed+(state.timer.running?Math.max(0,Date.now()-state.timer.started):0);
const fmt=ms=>{let s=Math.floor(Math.max(0,ms)/1000);return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());
function getOptions(){let rec=defaults[state.day]||[];if(state.category==='Recommended')return [...rec,...library.map(e=>e.name).filter(n=>!rec.includes(n))];if(state.category==='All')return library.map(e=>e.name);return library.filter(e=>e.category===state.category).map(e=>e.name)}
function chooseValid(){const names=getOptions();if(!names.includes(state.exercise))state.exercise=names[0]||library[0].name}
function countdownLeft(){const c=state.countdown;return c.running?Math.max(0,c.until-Date.now()):Math.max(0,c.remaining*1000)}
function prismRGB(p){const stops=[[0,0,225,255],[.35,125,50,255],[.7,255,0,225],[1,255,0,125]];let j=1;while(j<stops.length-1&&p>stops[j][0])j++;const a=stops[j-1],b=stops[j],t=Math.max(0,Math.min(1,(p-a[0])/(b[0]-a[0])));return [1,2,3].map(k=>Math.round(a[k]+(b[k]-a[k])*t))}
function clockUpdate(){
const el=$('v7elapsed');if(el)el.textContent=fmt(elapsed());
const c=state.countdown;const left=countdownLeft();if(c.running&&left<=0){c.running=false;c.remaining=0;c.until=0;persist();if(navigator.vibrate)navigator.vibrate([160,90,160])}
const p=Math.max(0,Math.min(1,1-left/(Math.max(1,c.duration)*1000)));
const rgb=prismRGB(p),bright=`rgb(${rgb.join(',')})`,fill=`rgb(${rgb.map(v=>Math.round(v*.55+13)).join(',')})`;
const card=$('v7spectrum');if(card){card.style.setProperty('--prism-bright',bright);card.style.setProperty('--prism-fill',fill)}
const track=$('v7progress');if(track)track.style.width=(p*100)+'%';
const time=$('v7time');if(time)time.textContent=fmt(left);
const percent=$('v7percent');if(percent)percent.textContent=Math.round(p*100)+'% COMPLETE';
const btn=$('v7countstart');if(btn)btn.textContent=c.running?'⏸ Pause':left<=0?'▶ Restart':'▶ Start / Resume';
const run=$('v7start');if(run)run.textContent=state.timer.running?'⏸ Pause workout':elapsed()?'▶ Resume workout':'▶ Start workout';
const rest=$('v7resttime');if(rest){let ms=state.rest.running?Math.max(0,state.rest.until-Date.now()):state.rest.remaining;rest.textContent=fmt(ms);if(state.rest.running&&ms<=0){state.rest.running=false;state.rest.remaining=0;persist()}}
}
setInterval(clockUpdate,250);
function keepFields(){for(const [id,key] of Object.entries({v7date:'date',v7reps:'reps',v7load:'load',v7seconds:'seconds',v7rpe:'rpe',v7tempo:'tempo',v7duration:'duration',v7effort:'effort',v7before:'before',v7after:'after',v7neuro:'neuro',v7notes:'notes'})){const e=$(id);if(e)state[key]=e.value}persist()}
function setsHTML(){let sets=state.sets.filter(s=>s.name===state.exercise);return sets.length?sets.map((s,i)=>`<div class="v7-logged"><div><b>Set ${i+1}</b> <span class="v7-badge">✓ Logged</span><div class="sub">${esc(s.reps||'—')} reps · ${esc(s.load||'BW')} lb · ${esc(s.seconds||'—')} sec · RPE ${esc(s.rpe||'—')}</div></div><button class="secondary" data-v7edit="${esc(s.id)}">Edit</button></div>`).join(''):'<p class="v7-hint">No sets logged for this exercise yet.</p>'}
function drawSets(){const e=$('v7sets');if(!e)return;e.innerHTML=setsHTML();e.querySelectorAll('[data-v7edit]').forEach(b=>b.onclick=()=>{let s=state.sets.find(s=>s.id===b.dataset.v7edit);if(!s)return;let r=prompt('Reps (blank for timed set)',s.reps);if(r===null)return;let l=prompt('Load in lb (blank for bodyweight)',s.load);if(l===null)return;let sec=prompt('Hold seconds (optional)',s.seconds);if(sec===null)return;let effort=prompt('Set RPE (1–10, optional)',s.rpe);if(effort===null)return;if((!r&&!sec)||[r,l,sec,effort].some(v=>v!==''&&(!Number.isFinite(Number(v))||Number(v)<0))||(effort!==''&&(Number(effort)<1||Number(effort)>10))){alert('Check the set values.');return}Object.assign(s,{reps:r,load:l,seconds:sec,rpe:effort});persist();drawSets()})}

<div class="card v7-spectrum-card" id="v7spectrum"><div class="v7-section-title">PRISM · CHROMATIC COUNTDOWN ⚡</div><div class="v7-glass"><div class="v7-clock" id="v7time">${fmt(countdownLeft())}</div><div class="v7-glass-label">REMAINING</div></div><div class="v7-spectrum-track" aria-label="Countdown progress"><span id="v7progress"></span></div><div class="v7-row v7-spectrum-note"><span>START</span><span id="v7percent">0% COMPLETE</span><span>FINISH</span></div><div class="v7-count-controls"><div><label for="v7countduration">Set / rest duration (seconds)</label><input type="number" id="v7countduration" min="5" max="3600" step="1" value="${state.countdown.duration}"></div><div><label for="v7countpreset">Quick duration</label><select id="v7countpreset"><option value="">Choose…</option><option value="30">30 seconds</option><option value="60">60 seconds</option><option value="90">90 seconds</option><option value="120">120 seconds</option><option value="180">180 seconds</option></select></div></div><div class="v7-actions"><button id="v7countstart">▶ Start / Resume</button><button class="secondary" id="v7countreset">Reset</button><button class="secondary" id="v7rest">Rest 90s</button></div><div class="v7-elapsed-strip"><span>Workout elapsed <b id="v7elapsed">${fmt(elapsed())}</b></span><button class="secondary" id="v7start">${state.timer.running?'⏸ Pause workout':'▶ Start workout'}</button></div><div class="v7-row" style="margin-top:9px"><span class="v7-hint" style="color:white">Rest countdown</span><b id="v7resttime" style="color:white">${fmt(state.rest.remaining)}</b></div><div class="v7-hint" style="color:white;margin-top:8px">The neon gradient tracks a timed set or rest. Workout elapsed time is separate. Timers use timestamps when you return to Safari; background alerts are not guaranteed.</div></div>
<div class="card"><div class="v7-section-title">Record your next set</div><h3 style="margin:5px 0 12px">${esc(state.exercise)}</h3><div class="grid"><div><label>Reps</label><input id="v7reps" type="number" min="0" step="1" inputmode="numeric" value="${esc(state.reps)}"></div><div><label>Load (lb)</label><input id="v7load" type="number" min="0" step="0.5" inputmode="decimal" placeholder="Bodyweight" value="${esc(state.load)}"></div><div><label>Hold / timed set (sec)</label><input id="v7seconds" type="number" min="0" inputmode="numeric" placeholder="Optional" value="${esc(state.seconds)}"></div><div><label>Set effort (RPE)</label><input id="v7rpe" type="number" min="1" max="10" value="${esc(state.rpe)}"></div></div><label>Tempo (optional)</label><input id="v7tempo" placeholder="3-1-2-0" value="${esc(state.tempo)}"><button class="full" id="v7log">✓ Log Set</button><div class="v7-summary"><div class="v7-row"><b>Completed sets</b><span class="v7-badge">${state.sets.length} total</span></div><div id="v7sets">${setsHTML()}</div></div><details><summary>Show all logged exercises</summary><div id="v7all"></div></details></div>
<div class="card"><h3>Finish workout</h3><div class="grid"><div><label>Duration (min)</label><input id="v7duration" type="number" min="0" max="600" value="${esc(state.duration)}"></div><div><label>Overall RPE</label><input id="v7effort" type="number" min="1" max="10" value="${esc(state.effort)}"></div><div><label>Back discomfort before</label><input id="v7before" type="number" min="0" max="10" value="${esc(state.before)}"></div><div><label>Back discomfort after</label><input id="v7after" type="number" min="0" max="10" value="${esc(state.after)}"></div></div><label>Neurological symptoms</label><select id="v7neuro"><option value="none">None</option><option value="unchanged">Usual, unchanged</option><option value="new">New / worsening radiating symptoms</option><option value="weakness">New weakness</option></select><label>Notes (optional)</label><textarea id="v7notes">${esc(state.notes)}</textarea><button class="full" id="v7save">Finish & save workout</button><button class="secondary full" style="margin-top:10px" id="v7discard">Discard draft</button><p class="v7-hint">Your sets are saved as a draft until you finish the session. Existing history and backups are preserved.</p></div>
<div class="v7-modal" id="v7modal" hidden role="dialog" aria-modal="true" aria-label="Exercise movement preview"><div class="v7-dialog"><div class="v7-row"><h3 id="v7modalname"></h3><button class="secondary" id="v7close">✕ Close</button></div><div class="v7-frames" id="v7frames"></div></div></div>`;
$('v7neuro').value=state.neuro;
for(const id of ['v7date','v7reps','v7load','v7seconds','v7rpe','v7tempo','v7duration','v7effort','v7before','v7after','v7neuro','v7notes'])$(id).addEventListener('input',keepFields);
$('v7back').onclick=()=>{keepFields();window.bodyLabV7Back?.()};
$('v7day').onchange=()=>{keepFields();state.day=$('v7day').value;state.category='Recommended';state.exercise='';show()};
document.querySelectorAll('[data-v7cat]').forEach(b=>b.onclick=()=>{keepFields();state.category=b.dataset.v7cat;state.exercise='';show()});
$('v7exercise').onchange=()=>{keepFields();state.exercise=$('v7exercise').value;show()};
$('v7countduration').onchange=()=>{const n=Math.min(3600,Math.max(5,Math.round(Number($('v7countduration').value)||60)));state.countdown={duration:n,remaining:n,until:0,running:false};$('v7countduration').value=n;persist();clockUpdate()};
$('v7countpreset').onchange=()=>{if(!$('v7countpreset').value)return;const n=Number($('v7countpreset').value);state.countdown={duration:n,remaining:n,until:0,running:false};$('v7countduration').value=n;persist();clockUpdate()};
$('v7countstart').onclick=()=>{const c=state.countdown;if(c.running){c.remaining=countdownLeft()/1000;c.running=false;c.until=0}else{if(c.remaining<=0)c.remaining=c.duration;c.until=Date.now()+c.remaining*1000;c.running=true}persist();clockUpdate()};
$('v7countreset').onclick=()=>{const c=state.countdown;c.remaining=c.duration;c.until=0;c.running=false;persist();clockUpdate()};
$('v7start').onclick=()=>{if(state.timer.running){state.timer.elapsed=elapsed();state.timer.running=false;state.timer.started=0}else{state.timer.started=Date.now();state.timer.running=true}persist();clockUpdate()};
$('v7reset').onclick=()=>{if(!confirm('Reset elapsed timer?'))return;state.timer={elapsed:0,started:0,running:false};persist();clockUpdate()};
$('v7rest').onclick=()=>{startRest();state.countdown={duration:90,remaining:90,until:Date.now()+90000,running:true};$('v7countduration').value=90;persist();clockUpdate()};
$('v7log').onclick=()=>{keepFields();const r=state.reps,t=state.seconds,l=state.load,e=state.rpe;if((!r&&!t)||[r,t,l,e].some(v=>v!==''&&(!Number.isFinite(Number(v))||Number(v)<0))||(e!==''&&(Number(e)<1||Number(e)>10))){alert('Enter valid reps or hold seconds, load, and RPE.');return}state.sets.push({id:uid(),name:state.exercise,reps:r,load:l,seconds:t,rpe:e,tempo:state.tempo,at:new Date().toISOString(),done:true});startRest();persist();drawSets();drawAll();clockUpdate()};
$('v7preview').onclick=()=>{let e=byName[state.exercise]||library[0];$('v7modalname').textContent=e.name;$('v7frames').innerHTML=prismIllustrations[e.name]?`<div class="v8-illustration"><img src="${prismIllustrations[e.name]}" alt="3D illustration of ${esc(e.name)} start and finish positions"><div class="v8-cue">START <span>→</span> FINISH</div></div>`:[0,1].map(i=>`<div class="v7-frame">${illustration(e.motion,i)}<small>${i?'FINISH':'START'}</small></div>`).join('');$('v7modal').hidden=false;$('v7close').focus()};
$('v7close').onclick=()=>{$('v7modal').hidden=true;$('v7preview').focus()};$('v7modal').onclick=e=>{if(e.target===$('v7modal'))$('v7modal').hidden=true};
$('v7discard').onclick=()=>{if(!confirm('Discard unfinished strength / core workout and its sets?'))return;state=fresh();persist();show()};
$('v7save').onclick=()=>{keepFields();const valid=(x,a,b)=>x!==''&&Number.isFinite(Number(x))&&Number(x)>=a&&Number(x)<=b;if(!state.date||!valid(state.duration,0,600)||!valid(state.effort,1,10)||!valid(state.before,0,10)||!valid(state.after,0,10)){alert('Check date, duration, effort and discomfort ratings.');return}if(!state.sets.length&&!confirm('No sets logged. Save anyway?'))return;const names=[...new Set(state.sets.map(s=>s.name))];const record={id:uid(),date:state.date,session:state.day,sessionName:(plan[state.day]?.name||'Strength / Core')+' · v0.7',duration:Number(state.duration),rpe:Number(state.effort),before:Number(state.before),after:Number(state.after),neuro:state.neuro,notes:state.notes,kind:'strength',exercises:names.map(n=>({name:n,dose:'',cue:'',tempo:'',setsLogged:state.sets.filter(s=>s.name===n).map(s=>({...s})),sets:state.sets.filter(s=>s.name===n).length+' completed sets',load:'',hold:''}))};db.logs.push(record);save();state=fresh();persist();alert('Workout saved: '+record.exercises.reduce((n,e)=>n+e.setsLogged.length,0)+' sets.');tab('history')};
drawSets();drawAll();clockUpdate();}
function drawAll(){let el=$('v7all');if(!el)return;let counts={};for(let s of state.sets)counts[s.name]=(counts[s.name]||0)+1;el.innerHTML=Object.entries(counts).map(([n,c])=>`<div class="v7-logged"><span>${esc(n)}</span><b>${c} sets</b></div>`).join('')||'<p class="v7-hint">Nothing logged yet.</p>'}
/* Compact offline vector demonstrations. The two positions use deliberate, motion-specific limb changes. */
function illustration(type,finish){
const f=finish, line=(x1,y1,x2,y2,c='#8ef8ee',w=6)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`,circle=(x,y,r=10)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#f0a5f5" stroke-width="5"/>`;
let s='',floor=line(8,145,152,145,'#5d628e',2),arrow=`<path d="M113 38 Q134 25 137 48" fill="none" stroke="#ffcf82" stroke-width="3" stroke-dasharray="4 4"/><path d="M131 42 L137 49 L143 42" fill="none" stroke="#ffcf82" stroke-width="3"/>`;
const upright=()=>circle(80,29)+line(80,40,80,96)+line(80,96,60,137)+line(80,96,100,137);
const lying=()=>circle(27,108)+line(40,110,105,110)+line(105,110,122,137)+line(122,137,145,137)+floor;
const allU=['pull','pass','press','curl','abduct','calf','pallof','rotate','hip','fly'];
if(type==='wallgastroc'||type==='wallsoleus'){
// Side view: wall at right, forward leg bent, rear heel grounded.
const bent=type==='wallsoleus';
s=line(142,10,142,145,'#9b86df',4)+floor+circle(f?83:72,37,9)+line(f?85:75,47,f?96:89,91)+line(f?82:72,56,125,63)+line(125,63,142,62,'#ffcf82',4);
s+=line(f?96:89,91,114,115)+line(114,115,129,143);
if(bent){s+=line(f?96:89,91,f?62:53,f?115:108)+line(f?62:53,f?115:108,25,143)}
else{s+=line(f?96:89,91,f?50:44,f?120:115)+line(f?50:44,f?120:115,23,143)}
s+=`<circle cx="23" cy="143" r="3" fill="#ffcf82"/>`;
}else if(type==='wallpec'){
// Top-down diagram clarifies torso rotation relative to a fixed horizontal arm.
s=`<text x="10" y="17" fill="#c7c4e6" font-size="10">TOP VIEW</text>`+line(19,48,145,48,'#9b86df',5);
s+=`<circle cx="80" cy="${f?101:91}" r="19" fill="none" stroke="#8ef8ee" stroke-width="5"/>`;
s+=line(80,f?101:91,34,48,'#ffcf82',6);
s+=line(80,f?101:91,f?114:125,f?128:105,'#8ef8ee',5);
s+=`<path d="M113 82 Q${f?135:122} 105 ${f?109:124} 128" stroke="#ffcf82" fill="none" stroke-width="3" stroke-dasharray="5 4"/>`;
}else if(type==='pigeon'){
// Side view: front shin folded, back leg extended, torso upright then gently inclined.
s=floor+circle(f?76:62,f?71:37,10)+line(f?77:64,f?81:47,83,108)+line(83,108,55,127)+line(55,127,26,127,'#ffcf82')+line(83,108,116,134)+line(116,134,150,134,'#ffcf82');
s+=line(f?76:64,f?89:55,f?104:46,f?117:85)+line(f?76:64,f?89:55,f?60:84,f?116:83);
}else if(allU.includes(type)){
s=upright();if(type==='pass')s+=line(80,52,f?47:35,f?93:62)+line(80,52,f?113:125,f?93:62)+line(f?47:35,f?93:62,f?113:125,f?93:62,'#ffcf82',3);
else if(type==='pull'||type==='fly')s+=line(80,52,f?24:60,f?52:76)+line(80,52,f?136:100,f?52:76)+line(f?24:60,f?52:76,f?136:100,f?52:76,'#ffcf82',3);
else if(type==='press')s+=line(80,52,55,f?8:65)+line(80,52,105,f?8:65)+line(44,f?8:65,66,f?8:65,'#ffcf82')+line(94,f?8:65,116,f?8:65,'#ffcf82');
else if(type==='curl')s+=line(80,52,52,75)+line(80,52,108,75)+line(52,75,f?62:49,f?53:101)+line(108,75,f?98:111,f?53:101);
else if(type==='abduct')s=circle(80,29)+line(80,40,80,96)+line(80,52,50,75)+line(80,52,110,75)+line(80,96,60,137)+line(80,96,f?136:100,f?120:137);
else if(type==='calf')s=upright()+line(60,137,60,f?130:142,'#ffcf82')+line(100,137,100,f?130:142,'#ffcf82');
else if(type==='pallof')s+=line(80,52,f?45:65,f?65:78)+line(80,52,f?115:95,f?65:78)+line(f?45:65,f?65:78,f?115:95,f?65:78,'#ffcf82');
else s+=line(80,52,f?20:55,f?44:75)+line(80,52,f?140:105,f?44:75);
}else if(['leg','dead','heel','sit','crunch','ham','bridge','tilt'].includes(type)){
s=lying();if(type==='leg'||type==='ham')s=circle(27,108)+line(40,110,100,110)+line(100,110,f?88:130,f?36:130)+line(f?88:130,f?36:130,f?95:146,f?10:135)+floor;
else if(type==='dead')s=circle(27,108)+line(40,110,90,110)+line(55,110,f?32:55,f?60:65)+line(90,110,f?115:90,f?65:83)+line(f?115:90,f?65:83,f?138:125,f?88:85)+floor;
else if(type==='heel')s=lying()+line(50,110,f?110:75,f?128:91,'#ffcf82');
else if(type==='sit'||type==='crunch')s=circle(f?70:27,f?70:108)+line(f?74:40,f?78:110,110,110)+line(110,110,125,138)+floor;
else if(type==='bridge')s=circle(27,108)+line(40,110,f?85:95,f?65:110)+line(f?85:95,f?65:110,125,138)+floor;
}else if(['bird','cat','push','plank'].includes(type)){
s=circle(45,70)+line(55,77,100,91)+line(65,80,55,135)+line(100,91,112,135)+floor;
if(type==='bird')s=circle(45,70)+line(55,77,100,91)+line(65,80,f?15:55,f?55:135)+line(100,91,f?150:112,f?65:135)+floor;
if(type==='cat')s=circle(45,70)+`<path d="M55 78 Q75 ${f?55:110} 100 91" fill="none" stroke="#8ef8ee" stroke-width="6"/>`+line(55,78,55,135)+line(100,91,112,135)+floor;
if(type==='push'||type==='plank')s=circle(f?35:35,f?105:72)+line(46,f?108:76,120,115)+line(55,f?109:80,55,140)+line(120,115,145,140)+floor;
}else if(['squat','step','lunge','hinge','sun'].includes(type)){
s=upright();if(type==='squat'||type==='lunge'||type==='step')s=circle(80,f?51:29)+line(80,f?61:40,80,f?101:96)+line(80,f?101:96,f?45:60,f?118:137)+line(80,f?101:96,f?117:100,f?120:137)+line(80,f?73:52,45,f?95:75)+line(80,f?73:52,115,f?95:75);
if(type==='hinge'||type==='sun')s=circle(f?125:80,f?60:29)+line(f?113:80,f?68:40,80,96)+line(80,96,60,137)+line(80,96,100,137)+line(f?105:80,f?78:52,f?133:48,f?98:75)+line(f?105:80,f?78:52,f?130:112,f?112:75);
}else s=upright()+line(80,52,f?25:50,f?35:75)+line(80,52,f?135:110,f?35:75);
return `<svg viewBox="0 0 160 160" role="img" aria-label="${f?'Finish':'Start'} position"><rect width="160" height="160" rx="9" fill="#101733"/>${s}${arrow}</svg>`;
}
window.bodyLabV7Strength=show;
})();
</script>
