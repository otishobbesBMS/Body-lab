let state=loadDraft(),ticker=null;
const newId=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());
function defaultExercises(key){return (plan[key]?.ex||[]).map(e=>({id:newId(),name:e[0],cue:e[2],dose:e[1],tempo:'3-1-2-0',sets:Array.from({length:(/^(\d+)/.exec(e[1])||[])[1]?Number((/^(\d+)/.exec(e[1]))[1]):1},()=>({id:newId(),reps:'',load:'',seconds:'',rpe:'',done:false,at:null}))}));}
function startState(key){return {date:today,session:key,exercises:defaultExercises(key),duration:30,rpe:7,before:0,after:0,neuro:'none',notes:'',safe:false,restSeconds:90,mode:'rest',endAt:null,remaining:90,startedAt:null,paused:true};}
const fmt=n=>{n=Math.max(0,Math.ceil(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};
function secondsLeft(){return state.endAt?Math.max(0,(state.endAt-Date.now())/1000):state.remaining;}
function tick(){if(!state||!document.getElementById('timerReadout'))return;const remaining=secondsLeft();$('timerReadout').textContent=fmt(remaining);$('timerStatus').textContent=state.endAt?(remaining>0?'Running '+(state.mode==='rest'?'rest countdown':'set countdown'):'Timer finished'):'Paused';if(state.endAt&&remaining<=0){state.endAt=null;state.remaining=0;state.paused=true;storeDraft();if(navigator.vibrate)navigator.vibrate([180,100,180]);$('timerStatus').textContent='Time complete (visual alert)';$('timerStatus').classList.add('warn')}}
function redrawSets(){const holder=$('exerciseList');if(!holder)return;holder.innerHTML=state.exercises.map((ex,i)=>`<div class="card"><div class="exhead"><b>${i+1}. ${esc(ex.name)}</b><button class="secondary" data-remove-ex="${i}">Remove</button></div><p class="tiny">${esc(ex.dose||'')} · ${esc(ex.cue||'')}</p><label>Exercise name</label><input data-ex="${i}" data-field="name" value="${esc(ex.name)}"><label>Tempo (seconds, optional)</label><input data-ex="${i}" data-field="tempo" value="${esc(ex.tempo||'')}" placeholder="3-1-2-0"><div class="tiny" style="margin:8px 0">Each set: reps (or leave blank for timed holds), load in lb, and hold duration in seconds. Tap ✓ when completed.</div>${ex.sets.map((set,j)=>`<div class="setline ${set.done?'done':''}"><b>${j+1}</b><div class="fieldgroup"><label>Reps</label><input type="number" min="0" step="1" inputmode="numeric" data-ex="${i}" data-set="${j}" data-field="reps" value="${esc(set.reps)}" placeholder="Reps"></div><div class="fieldgroup"><label>Load (lb)</label><input type="number" min="0" step="0.5" inputmode="decimal" data-ex="${i}" data-set="${j}" data-field="load" value="${esc(set.load)}" placeholder="lb"></div><button class="${set.done?'':'secondary'}" data-done="${i}:${j}">${set.done?'✓ Done':'✓ Log'}</button></div><div class="grid"><div><label>Hold / timed set (sec) · set ${j+1}</label><input type="number" min="0" data-ex="${i}" data-set="${j}" data-field="seconds" value="${esc(set.seconds)}" placeholder="Optional"></div><div><label>Set effort (RPE 1–10)</label><input type="number" min="1" max="10" data-ex="${i}" data-set="${j}" data-field="rpe" value="${esc(set.rpe)}" placeholder="Optional"></div></div>`).join('')}<button class="secondary" data-add-set="${i}">+ Add set</button></div>`).join('');
holder.querySelectorAll('input[data-ex]').forEach(el=>el.oninput=()=>{let e=state.exercises[+el.dataset.ex];let target=el.dataset.set===undefined?e:e.sets[+el.dataset.set];target[el.dataset.field]=el.value;storeDraft()});
holder.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{let [i,j]=b.dataset.done.split(':').map(Number),set=state.exercises[i].sets[j];if(!set.done&&!set.reps&&!set.seconds){alert('Enter reps or timed-set seconds before logging this set.');return}set.done=!set.done;set.at=set.done?new Date().toISOString():null;if(set.done){state.mode='rest';state.remaining=Number(state.restSeconds)||90;state.endAt=Date.now()+state.remaining*1000;state.paused=false;}storeDraft();redrawSets();tick()});
holder.querySelectorAll('[data-add-set]').forEach(b=>b.onclick=()=>{state.exercises[+b.dataset.addSet].sets.push({id:newId(),reps:'',load:'',seconds:'',rpe:'',done:false,at:null});storeDraft();redrawSets()});
holder.querySelectorAll('[data-remove-ex]').forEach(b=>b.onclick=()=>{if(confirm('Remove this exercise and its set data?')){state.exercises.splice(+b.dataset.removeEx,1);storeDraft();redrawSets()}});
}
workout=function(){if(!state)state=startState(dayOf(today));const options=['Mon','Tue','Wed','Thu','Fri','Sat','Sun','Custom'];$('workout').innerHTML=`<div class="card"><h2>Live workout logger</h2><div class="grid"><div><label>Date</label><input type="date" id="v2date" value="${esc(state.date)}"></div><div><label>Workout</label><select id="v2session">${options.map(k=>`<option value="${k}" ${state.session===k?'selected':''}>${k==='Custom'?'Custom workout':esc(plan[k].name)}</option>`).join('')}</select></div></div><p class="tiny">Your unfinished workout is automatically saved on this device. Log each set separately.</p></div><div class="timerbox"><div class="row" style="justify-content:space-between"><b>Set / rest timer</b><select id="timerMode" style="width:130px;margin:0"><option value="rest" ${state.mode==='rest'?'selected':''}>Rest</option><option value="set" ${state.mode==='set'?'selected':''}>Timed set</option></select></div><div class="clock" id="timerReadout">${fmt(secondsLeft())}</div><div id="timerStatus" class="status"></div><div class="grid"><div><label>Timer duration (seconds)</label><input type="number" min="5" max="3600" id="timerSeconds" value="${state.mode==='rest'?state.restSeconds:state.remaining}"></div><div><label>Quick rest preset</label><select id="preset"><option value="60">60 sec</option><option value="90" selected>90 sec</option><option value="120">120 sec</option><option value="180">180 sec</option></select></div></div><div class="timeractions"><button id="timerStart">Start / Resume</button><button class="secondary" id="timerPause">Pause</button><button class="secondary" id="timerReset">Reset</button></div><p class="tiny">Timer uses clock timestamps to stay accurate if you switch apps. iPhone browsers may not sound an alert in the background; keep the screen visible for reliable cues.</p></div><div id="exerciseList"></div><div class="card"><button class="secondary full" id="addExercise">+ Add exercise</button></div><div class="card"><h3>Finish workout</h3><div class="grid"><div><label>Duration (minutes)</label><input type="number" id="v2duration" min="0" max="600" value="${esc(state.duration)}"></div><div><label>Overall RPE (1–10)</label><input type="number" id="v2rpe" min="1" max="10" value="${esc(state.rpe)}"></div><div><label>Back symptoms before (0–10)</label><input type="number" id="v2before" min="0" max="10" value="${esc(state.before)}"></div><div><label>Back symptoms after (0–10)</label><input type="number" id="v2after" min="0" max="10" value="${esc(state.after)}"></div></div><label>Neurological symptoms</label><select id="v2neuro"><option value="none">None</option><option value="unchanged">Usual intermittent symptoms, unchanged</option><option value="new">New or worsening radiating symptoms</option><option value="weakness">New weakness or concerning symptoms</option></select><label>Session notes / yoga class</label><textarea id="v2notes" placeholder="How did it go?">${esc(state.notes)}</textarea><div class="checks"><input type="checkbox" id="v2safe" ${state.safe?'checked':''}><label for="v2safe" style="margin:0">I reviewed symptoms and modified provoking movements</label></div><button class="full" id="v2save">Finish and save workout</button><button class="danger full" style="margin-top:10px" id="v2discard">Discard unfinished workout</button><p id="v2message" class="status"></p></div>`;
redrawSets();$('v2neuro').value=state.neuro;
const map={v2date:'date',v2duration:'duration',v2rpe:'rpe',v2before:'before',v2after:'after',v2notes:'notes',v2neuro:'neuro'};Object.entries(map).forEach(([id,key])=>$(id).oninput=()=>{state[key]=$(id).value;storeDraft()});$('v2safe').onchange=()=>{state.safe=$('v2safe').checked;storeDraft()};$('v2session').onchange=()=>{if(state.exercises.some(e=>e.sets.some(s=>s.done))&&!confirm('Change session and clear current set entries?')){$('v2session').value=state.session;return}state=startState($('v2session').value);storeDraft();workout()};
$('addExercise').onclick=()=>{const name=prompt('Exercise name');if(!name?.trim())return;state.exercises.push({id:newId(),name:name.trim(),cue:'',dose:'',tempo:'',sets:[{id:newId(),reps:'',load:'',seconds:'',rpe:'',done:false,at:null}]});storeDraft();redrawSets()};
$('timerMode').onchange=()=>{state.mode=$('timerMode').value;state.endAt=null;state.remaining=state.mode==='rest'?Number(state.restSeconds):45;state.paused=true;$('timerSeconds').value=state.remaining;storeDraft();tick()};$('timerSeconds').onchange=()=>{let v=Math.min(3600,Math.max(5,Number($('timerSeconds').value)||90));state.remaining=v;state.endAt=null;state.paused=true;if(state.mode==='rest')state.restSeconds=v;storeDraft();tick()};$('preset').onchange=()=>{state.mode='rest';$('timerMode').value='rest';state.restSeconds=Number($('preset').value);state.remaining=state.restSeconds;state.endAt=null;state.paused=true;$('timerSeconds').value=state.remaining;storeDraft();tick()};$('timerStart').onclick=()=>{if(secondsLeft()<=0)state.remaining=Number($('timerSeconds').value)||90;state.endAt=Date.now()+secondsLeft()*1000;state.paused=false;storeDraft();tick()};$('timerPause').onclick=()=>{state.remaining=secondsLeft();state.endAt=null;state.paused=true;storeDraft();tick()};$('timerReset').onclick=()=>{state.endAt=null;state.remaining=Number($('timerSeconds').value)||90;state.paused=true;storeDraft();tick()};
$('v2discard').onclick=()=>{if(!confirm('Discard this unfinished workout and all logged sets?'))return;state=startState(dayOf(today));storeDraft();workout()};
$('v2save').onclick=()=>{const n=id=>Number($(id).value);if(!$('v2safe').checked){$('v2message').textContent='Review the symptom check before saving.';return}if(!state.date||![n('v2duration'),n('v2rpe'),n('v2before'),n('v2after')].every(Number.isFinite)||n('v2duration')<0||n('v2duration')>600||n('v2rpe')<1||n('v2rpe')>10||n('v2before')<0||n('v2before')>10||n('v2after')<0||n('v2after')>10){alert('Check date, duration, effort and symptom ratings.');return}const invalid=state.exercises.some(e=>e.sets.some(s=>s.done&&((!s.reps&&!s.seconds)||[s.reps,s.load,s.seconds,s.rpe].some(v=>v!==''&&(!Number.isFinite(Number(v))||Number(v)<0))||(s.rpe!==''&&(Number(s.rpe)<1||Number(s.rpe)>10)))));if(invalid){alert('Check completed set entries for valid reps, time, load and RPE.');return}const count=state.exercises.reduce((sum,e)=>sum+e.sets.filter(s=>s.done).length,0);if(!count&&!confirm('No completed sets logged. Save this session anyway (e.g., yoga or cardio)?'))return;
const record={id:newId(),date:state.date,session:state.session,sessionName:plan[state.session]?.name||'Custom',duration:n('v2duration'),rpe:n('v2rpe'),before:n('v2before'),after:n('v2after'),neuro:state.neuro,notes:state.notes,exercises:state.exercises.map(e=>({name:e.name,dose:e.dose,cue:e.cue,tempo:e.tempo,setsLogged:e.sets.map(s=>({...s})),sets:e.sets.filter(s=>s.done).length+' completed sets',load:'',hold:''}))};db.logs.push(record);save();clearDraft();state=null;const warn=record.neuro==='new'||record.neuro==='weakness'||record.after>record.before+2;alert('Workout saved: '+count+' completed sets.'+(warn?' Reassess symptoms before further hard training; new or worsening neurological symptoms warrant medical evaluation.':''));tab('history')};tick();};
const originalHistory=history;
history=function(){originalHistory();document.querySelectorAll('[data-view]').forEach(b=>{const old=b.onclick;b.onclick=()=>{old();const x=db.logs.find(y=>y.id===b.dataset.view);if(!x)return;const detail=$('detail');const summary=x.exercises.filter(e=>Array.isArray(e.setsLogged));if(summary.length){const target=detail.querySelector('h3');if(target){const extra=document.createElement('div');extra.innerHTML='<h3 style="margin-top:16px">Individual sets</h3>'+summary.map(e=>`<div class="entry"><b>${esc(e.name)}</b>${e.setsLogged.map((s,i)=>`<div class="sub">Set ${i+1}: ${esc(s.reps||'—')} reps · ${esc(s.load||'—')} lb · ${esc(s.seconds||'—')} sec · RPE ${esc(s.rpe||'—')} · ${s.done?'✓ Completed':'Not completed'}</div>`).join('')}</div>`).join('');target.after(extra)}}}})};
})();
</script></body></html>
